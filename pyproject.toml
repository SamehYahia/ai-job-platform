[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection intentionally uses Depends in defaults.
extend-immutable-calls = ["fastapi.Depends"]