name: CI Quality Gates

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# Follow least privilege: this workflow only needs to read repository contents.
permissions:
  contents: read

jobs:
  quality:
    name: Python Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Check out the exact repository revision that triggered this workflow.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use the same Python major/minor version as the runtime container.
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Install both runtime and development dependencies.
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      # Detect incompatible or broken Python dependency relationships.
      - name: Validate dependency compatibility
        run: python -m pip check

      # Enforce linting and import-order rules defined in pyproject.toml.
      - name: Run Ruff linting
        run: ruff check .

      # Verify formatting without modifying source files in CI.
      - name: Check Ruff formatting
        run: ruff format --check .

      # Run the complete current Python test suite.
      - name: Run Pytest
        run: pytest