name: CI Quality Gates

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  # Allow an authorized engineer to run a full-history baseline scan.
  workflow_dispatch:

# Follow least privilege: jobs only need read access.
permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Python Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Check out the exact repository revision that triggered this workflow.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use the same Python major/minor version as the runtime container.
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Install both runtime and development dependencies.
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      # Detect incompatible or broken Python dependency relationships.
      - name: Validate dependency compatibility
        run: python -m pip check

      # Enforce linting and import-order rules defined in pyproject.toml.
      - name: Run Ruff linting
        run: ruff check .

      # Verify formatting without modifying source files in CI.
      - name: Check Ruff formatting
        run: ruff format --check .

      # Keep fast tests independent from external service containers.
      - name: Run fast Pytest suite
        run: python -m pytest -m "not integration"

  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        # Match the PostgreSQL major version used by Docker Compose.
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ai_job_platform_test
          POSTGRES_USER: postgres

          # This credential belongs only to the disposable CI service container.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_job_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Check out the exact repository revision that triggered this workflow.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Run migrations and tests with the project's supported Python version.
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Psycopg and Alembic are installed through the existing dependency files.
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      # Build the test schema through the same migration path used at runtime.
      - name: Apply Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_job_platform_test
        run: python -m alembic upgrade head

      # The test enforces PostgreSQL and refuses databases without the _test suffix.
      - name: Run PostgreSQL integration test
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_job_platform_test
        run: python -m pytest -m integration

  docker-image:
    name: Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # These values belong only to disposable CI containers.
    env:
      COMPOSE_PROJECT_NAME: ai-job-platform-ci
      POSTGRES_DB: ai_job_platform_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-ci-only

    steps:
      # Check out the exact repository revision that triggered this workflow.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Detect invalid Compose syntax and unresolved required variables.
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      # Build the runtime image from the repository Dockerfile.
      - name: Build application image
        run: docker compose build --pull app
              # Scan the final runtime image before starting any containers.
      - name: Scan application image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ai-job-platform-api:local
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          format: table
          version: "v0.74.0"
          cache: "true"

      # Start the complete stack and wait for all health checks to pass.
      - name: Start application stack
        run: docker compose up --detach --wait --wait-timeout 120

      # Verify the API process and its PostgreSQL dependency.
      - name: Verify application health
        run: |
          scheme="http"
          address="127.0.0.1:8000"
          base_url="${scheme}://${address}"
          curl --fail --silent --show-error --write-out '\n' \
            "${base_url}/health/live"
          curl --fail --silent --show-error --write-out '\n' \
            "${base_url}/health/ready"

      # Prove that the application process does not run as root.
      - name: Verify non-root execution
        run: |
          docker compose exec -T app python -c \
            "import os; assert os.geteuid() == 10001, os.geteuid(); print(os.geteuid())"

      # Preserve diagnostics when any earlier validation step fails.
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      # Remove disposable containers, networks, and database data on every outcome.
      - name: Clean up Docker resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  trivy-filesystem:
    name: Trivy Filesystem
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Check out the exact repository revision being validated.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Detect vulnerable application dependencies and IaC/container misconfigurations.
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "1"
          format: table
          version: "v0.74.0"
          cache: "true"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Full history is required for baseline and commit-range secret scanning.
      - name: Checkout complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Detect hardcoded secrets using pinned action and scanner versions.
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"

          # Preserve least privilege by avoiding PR write access.
          GITLEAKS_ENABLE_COMMENTS: "false"

          # Avoid retaining secret-finding metadata as a downloadable artifact.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
