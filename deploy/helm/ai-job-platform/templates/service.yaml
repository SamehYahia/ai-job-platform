apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-job-platform.fullname" . }}
  labels:
    {{- include "ai-job-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "ai-job-platform.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
