apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ai-job-platform-dev
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ai-job-platform
    environment: dev

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: postgres

  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: ai-job-platform

    spec:
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: postgres
          image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ai-job-platform-database
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ai-job-platform-database
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-job-platform-database
                  key: POSTGRES_PASSWORD

          securityContext:
            allowPrivilegeEscalation: false

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql

      volumes:
        - name: postgres-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-job-platform-dev
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ai-job-platform

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: postgres

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
